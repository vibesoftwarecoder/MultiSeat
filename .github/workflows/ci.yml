name: CI

# The project had no CI at all until 2026-08-20, and the cost of that was concrete: a
# PowerShell 7 only operator in install-service.ps1 shipped in the FIRST public release and
# survived four more, making the documented install command fail before its first step on the
# default shell of every Windows host. Nothing ever checked. These two jobs are the cheapest
# things that would have caught it.

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build + test
    runs-on: windows-latest   # net9.0-windows10.0.19041.0 / win-x64, and the tests use Windows APIs

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore src/MultiSeat.slnx

      - name: Build
        run: dotnet build src/MultiSeat.slnx -c Release --no-restore

      - name: Test
        run: >
          dotnet test src/MultiSeat.slnx -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()          # the results are most interesting exactly when the step failed
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: test-results/
          if-no-files-found: warn

  dashboard:
    name: Dashboard build + audit
    runs-on: ubuntu-latest    # pure Node work; nothing here needs Windows

    # Nothing in CI touched the dashboard until now, and the cost of that was concrete too:
    # 11 advisories (8 high) accumulated in package-lock.json unnoticed, and it took an
    # outside scanner opening issues #34 and #35 for anyone to look. The dashboard also had
    # no build check at all, so a TypeScript error would only surface during an install on a
    # user's machine.
    defaults:
      run:
        working-directory: src/MultiSeat.Dashboard

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: src/MultiSeat.Dashboard/package-lock.json

      # npm ci, not npm install: it installs exactly what the lockfile pins and fails if the
      # lockfile and package.json disagree. install-service.ps1 runs npm install on the user's
      # machine, so a lockfile that cannot resolve breaks the install, not the build.
      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      # This FAILS the job on a high advisory, deliberately. A warning that does not fail is
      # what we already had -- nothing was watching, and 8 highs is what nothing-watching
      # produces. The tradeoff is real: an advisory published upstream can break CI on an
      # unrelated PR. That is the intended behaviour, not a bug. When it happens, fix it with
      # `npm audit fix` (which cleared all 11 here without touching package.json), and if a
      # finding genuinely does not apply, record why with `npm audit --json` in the PR rather
      # than lowering this threshold.
      - name: Audit
        run: npm audit --audit-level=high

  lint-scripts:
    name: Script lint (PowerShell 5.1 + 7)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      # Both engines, deliberately. They disagree, and 5.1 is the one a user gets by typing
      # "powershell" - a script can parse perfectly under 7 and be dead on arrival under 5.1,
      # which is exactly what shipped in April. Proven against controls: a file using
      # (Get-Command x)?.Source fails here under 5.1 and passes under 7.
      - name: Windows PowerShell 5.1
        shell: powershell
        run: .\scripts\lint-scripts.ps1

      - name: PowerShell 7
        shell: pwsh
        run: .\scripts\lint-scripts.ps1
